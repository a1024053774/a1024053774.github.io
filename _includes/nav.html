<!-- Navigation -->
{% assign current_page_url = page.url %}
{% if page.nav-style == "invert" or page.header-style == "text" %}
<nav class="navbar navbar-default navbar-custom navbar-fixed-top invert">
    {% else %}
    <nav class="navbar navbar-default navbar-custom navbar-fixed-top">
        {% endif %}
        <div class="container-fluid">
            <!-- Brand and toggle get grouped for better mobile display -->
            <div class="navbar-header page-scroll">
                <button type="button" class="navbar-toggle" aria-expanded="false" aria-controls="huxblog_navbar">
                    <span class="sr-only">导航菜单</span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <a class="navbar-brand" href="{{ site.baseurl }}/"><span class="brand-seal" aria-hidden="true">遠</span><span class="brand-name">{{ site.title }}</span></a>
            </div>

            <!-- Collect the nav links, forms, and other content for toggling -->
            <div id="huxblog_navbar">
                <div class="navbar-collapse">
                    <ul class="nav navbar-nav navbar-right">
                        <li>
                            <a class="nav-pill{% if page.url == '/' %} is-active{% endif %}" href="{{ site.baseurl }}/"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
                        </li>
                        {% for page in site.pages %}
                        {% if page.title and page.hide-in-nav != true %}
                        <li>
                            <a class="nav-pill{% if page.url == current_page_url %} is-active{% endif %}" href="{{ page.url | prepend: site.baseurl }}"{% if page.url == current_page_url %} aria-current="page"{% endif %}>{{ page.title }}</a>
                        </li>
                        {% endif %}
                        {% endfor %}
                        <!-- 添加深色模式切换按钮 -->
                        <li class="darkmode-toggle">
                            <button type="button" class="nav-pill nav-pill--icon" id="darkmode-toggle" title="切换深色/浅色模式" aria-label="切换深色或浅色模式">
                                <i class="fa fa-moon-o" id="darkmode-icon" aria-hidden="true"></i>
                            </button>
                        </li>
                        <li class="search-icon">
                            <a class="nav-pill nav-pill--icon" href="javascript:void(0)" aria-label="打开搜索">
                                <i class="fa fa-search"></i>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
            <!-- /.navbar-collapse -->
        </div>
        <!-- /.container -->
    </nav>

    <script>
        // Drop Bootstarp low-performance Navbar
        // Use customize navbar with high-quality material design animation
        // in high-perf jank-free CSS3 implementation
        var $toggle = document.querySelector('.navbar-toggle');
        var $navbar = document.querySelector('#huxblog_navbar');

        var __HuxNav__ = {
            close: function () {
                if (!$navbar.classList.contains('in')) return;
                var returnFocus = $navbar.contains(document.activeElement);
                $navbar.classList.remove('in');
                $toggle.setAttribute('aria-expanded', 'false');
                if (returnFocus) $toggle.focus({ preventScroll: true });
            },
            open: function () {
                $navbar.classList.add('in');
                $toggle.setAttribute('aria-expanded', 'true');
            }
        }

        // Bind Event
        $toggle.addEventListener('click', function (e) {
            if ($navbar.classList.contains('in')) {
                __HuxNav__.close()
            } else {
                __HuxNav__.open()
            }
        })

        /**
         * Since Fastclick is used to delegate 'touchstart' globally
         * to hack 300ms delay in iOS by performing a fake 'click',
         * Using 'e.stopPropagation' to stop 'touchstart' event from 
         * $toggle/$collapse will break global delegation.
         * 
         * Instead, we use a 'e.target' filter to prevent handler
         * added to document close HuxNav.  
         *
         * Also, we use 'click' instead of 'touchstart' as compromise
         */
        document.addEventListener('click', function (e) {
            if ($toggle.contains(e.target)) return;
            __HuxNav__.close();
        })
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && $navbar.classList.contains('in')) {
                e.preventDefault();
                __HuxNav__.close();
                $toggle.focus({ preventScroll: true });
            }
        })
    </script>
